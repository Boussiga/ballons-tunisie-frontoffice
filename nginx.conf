server {
    listen 80;
    root /usr/share/nginx/html;

    # React Router: unknown paths load index.html
    location / {
        try_files $uri /index.html;
    }

    # Same as the Vite dev proxy: the API is the "api" service of docker compose
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://api:3000;
    }
}
